---

- name: converge
  hosts: all

  tasks:

    - name: include the role
      ansible.builtin.include_role:
        name: idiv_biodiversity.systemd.systemd_timer
      vars:
        systemd_timer_name: uname-timer
        systemd_timer_scripts:
          - src: uname-timer.sh
            dest: /usr/sbin/uname-timer
        systemd_timer_on_startup_sec: 0

...
